<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>LLM 性能测试工具</title>
  <style>
    :root{
      --bg:#5b39ff;
      --card:#ffffff;
      --border:#e6e6e6;
      --text:#111827;
      --muted:#6b7280;
      --btn:#2563eb;
      --btn2:#ef4444;
      --radius:16px;
    }
    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      background: linear-gradient(135deg, var(--bg), #2b2bd9);
      min-height:100vh;
      display:flex;
      align-items:flex-start;
      justify-content:center;
      padding:28px 16px;
      color:var(--text);
    }
    .card{
      width:min(980px, 100%);
      background:var(--card);
      border-radius:var(--radius);
      box-shadow: 0 12px 30px rgba(0,0,0,.18);
      padding:22px 22px 16px;
    }
    .title{ font-size:26px; font-weight:800; margin:2px 0 16px; }
    .subtitle{ font-size:13px; color:var(--muted); margin:0 0 14px; }
    .form{ display:flex; flex-direction:column; gap:12px; }
    .field label{ display:block; font-size:13px; color:#374151; margin-bottom:6px; font-weight:600; }
    .field input, .field textarea{
      width:100%;
      box-sizing:border-box;
      border:1px solid var(--border);
      border-radius:12px;
      padding:10px 12px;
      font-size:14px;
      outline:none;
      background:#fff;
    }
    .field textarea{ min-height:110px; resize:vertical; }
    .row{ display:grid; grid-template-columns: 1fr 1fr; gap:12px; }
    @media (max-width:760px){ .row{ grid-template-columns: 1fr; } }
    .actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:6px; }
    button{
      border:0; border-radius:12px; padding:10px 14px;
      font-size:14px; font-weight:700; cursor:pointer;
    }
    .btn{ background:var(--btn); color:white; }
    .btn2{ background:var(--btn2); color:white; }
    .linkbtn{
      display:inline-block; text-decoration:none; color:#2563eb; font-weight:700; font-size:13px;
      padding:8px 10px; border:1px solid var(--border); border-radius:12px;
    }
    .result{ margin-top:14px; border-top:1px solid var(--border); padding-top:12px; }
    pre{
      margin:10px 0 0;
      background:#0b1020;
      color:#e5e7eb;
      border-radius:12px;
      padding:12px;
      overflow:auto;
      font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      font-size:12px;
      line-height:1.5;
      max-height:280px;
      white-space:pre-wrap;
    }
    .topbar{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }

    .float-wrap{
      position:relative;
      width:100%;
      min-height:320px;
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap:12px;
      align-items:start;
    }
    .float-win{
      position:relative;
      width:100%;
      max-height:520px;
      background:#ffffff;
      border:1px solid var(--border);
      border-radius:14px;
      box-shadow: 0 12px 30px rgba(0,0,0,.20);
      overflow:hidden;
      pointer-events:auto;
    }
    .float-head{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:10px 12px;
      background: linear-gradient(135deg, #eef2ff, #ffffff);
      border-bottom:1px solid var(--border);
      cursor:default;
      user-select:none;
      font-weight:800;
      font-size:13px;
    }
    .float-meta{ font-weight:600; color: var(--muted); font-size:12px; }
    .float-body{ padding:10px 12px; overflow:auto; max-height: 460px; }
    .pill{ display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; font-weight:800; border:1px solid var(--border); }
    .pill.ok{ background:#ecfdf5; }
    .pill.bad{ background:#fef2f2; }
    .pill.run{ background:#eff6ff; }
    .mini{ font-size:12px; color: var(--muted); margin:8px 0 0; }
    .float-pre{
      margin:10px 0 0;
      background:#0b1020;
      color:#e5e7eb;
      border-radius:12px;
      padding:10px;
      overflow:auto;
      font-family: ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      font-size:12px;
      line-height:1.5;
      white-space:pre-wrap;
    }
    .xbtn{
      border:0;
      background:transparent;
      font-size:16px;
      cursor:pointer;
      padding:2px 6px;
      border-radius:10px;
    }
    .xbtn:hover{ background:#f3f4f6; }
    .chart-img{
      width:100%;
      border-radius:12px;
      border:1px solid var(--border);
      background:#fff;
      display:block;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="topbar"> 
      <div>
        <div class="title">🚀 LLM 性能测试工具</div>
        <div class="subtitle">路由：<code>/submitPrompt</code>、<code>/result</code>、<code>/halt</code>、<code>/models</code></div>
      </div>
    </div>

    <div class="form">
      <div class="field">
        <label>API 地址</label>
        <input id="apiUrl" type="text" value="http://localhost:11434/v1" />
      </div>

      <div class="field">
        <label>API Key（可选）</label>
        <input id="apiKey" type="password" />
      </div>

      <div class="row">
        <div class="field">
          <label>模型名称（自动读取本地 Ollama）</label>
          <select id="model"></select>
          <div class="subtitle" style="margin:8px 0 0;">如果列表为空，请确认 Ollama 正在运行，且后端提供 <code>/models</code>。</div>
        </div>

        <div class="field">
          <label>并发用户数量</label>
          <input id="numUsers" type="number" value="1" min="1" />
        </div>
      </div>
      <div class="field">
        <label>用户提示词</label>
        <textarea id="prompt">What is Llama 3.2 1B? write in 100 words.</textarea>
      </div>

      <div class="actions">
        <button class="btn" id="submitBtn">开始测试</button>
        <button class="btn" id="getResultBtn">查看结果</button>
        <button class="btn2" id="haltBtn">停止</button>
        <button class="btn2" id="clearBtn">清除结果</button>
      </div>
    </div>

    <div class="result">
      <div style="font-weight:800;">并发结果</div>
      <div class="subtitle">每个并发结果会在这里固定显示。</div>
      <div id="summaryBar" class="subtitle" style="margin:8px 0 12px;"></div>
      <div id="floatWrap" class="float-wrap"></div>
      <pre id="output" style="display:none;">{}</pre>
    </div>

    <div class="result">
      <div style="font-weight:800;">性能图表</div>
      <div class="subtitle">按并发数排序展示历史测试结果（TTFT / Token/s）。</div>
      <img id="statChart" class="chart-img" alt="性能图表" />  
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);

  // Floating windows (one per concurrent user)
  let pollTimer = null;
  let currentRunId = null;
  let hasSeenActiveRun = false;
  let expectedRunCount = 0;

  function stopPolling(){
    if (pollTimer){
      clearInterval(pollTimer);
      pollTimer = null;
    }
  }

  function makeDraggable(winEl, handleEl){
    return;
  }

  function createFloatingWindows(numUsers){
    const wrap = $("floatWrap");
    wrap.innerHTML = "";

    for (let i = 0; i < numUsers; i++){
      const win = document.createElement("div");
      win.className = "float-win";
      win.id = `fw-${i}`;

      win.innerHTML = `
        <div class="float-head" id="fw-head-${i}">
          <div>
            <span class="pill run">Run #${i+1}</span>
            <span class="float-meta" id="fw-meta-${i}">等待数据…</span>
          </div>
          <button class="xbtn" title="关闭" id="fw-close-${i}">✕</button>
        </div>
        <div class="float-body">
          <div id="fw-st-${i}" class="mini">status: pending</div>
          <div id="fw-metrics-${i}" class="mini">latency: - , token/s: - , tokens: -</div>
          <pre class="float-pre" id="fw-pre-${i}">(暂无输出)</pre>
        </div>
      `;

      wrap.appendChild(win);

      const head = win.querySelector(`#fw-head-${i}`);
      makeDraggable(win, head);

      const closeBtn = win.querySelector(`#fw-close-${i}`);
      closeBtn.addEventListener("click", () => { win.remove(); });
    }
  }

  function updateFloatingWindows(latest){
    if (!latest) return;
    const runs = latest.runs || [];

    for (let i = 0; i < runs.length; i++){
      const r = runs[i] || {};
      const meta = $(`fw-meta-${i}`);
      const st = $(`fw-st-${i}`);
      const metrics = $(`fw-metrics-${i}`);
      const pre = $(`fw-pre-${i}`);

      if (!meta || !st || !metrics || !pre) continue;

      const ok = !!r.ok;
      const statusCode = (r.status_code ?? "-");
      const err = (r.error || "");
      const status = r.status || (ok ? "completed" : (err ? "error" : "running"));

      meta.textContent = ok ? `HTTP ${statusCode}` : (err ? "error" : status);
      st.textContent = `status: ${status}`;

      const lat = (typeof r.latency === "number") ? r.latency.toFixed(3) : "-";
      const ttft = (typeof r.ttft_sec === "number") ? r.ttft_sec.toFixed(3) : "-";
      const tps = (typeof r.token_per_sec === "number") ? r.token_per_sec.toFixed(3) : "-";
      const toks = (typeof r.completion_tokens === "number") ? r.completion_tokens : "-";
      const started = (typeof r.started_at_offset_sec === "number") ? r.started_at_offset_sec.toFixed(3) : "-";
      const firstTok = (typeof r.first_token_at_offset_sec === "number") ? r.first_token_at_offset_sec.toFixed(3) : "-";

      metrics.textContent = `start+${started}s | first token+${firstTok}s | TTFT: ${ttft}s | latency: ${lat}s | token/s: ${tps} | tokens: ${toks}`;

      if (r.response && r.response.trim().length > 0){
        pre.textContent = r.response;
      } else if (err){
        pre.textContent = `ERROR: ${err}`;
      } else {
        pre.textContent = "(运行中…请稍等)";
      }
    }
  }

  async function pollResult(){
    try{
      const res = await fetch("/result", { method: "GET" });
      const j = await res.json();
      const runs = Array.isArray(j.runs) ? j.runs : [];
      const activeStatuses = new Set(["pending", "request_started", "streaming"]);
      if (runs.length === expectedRunCount && runs.some(r => r && activeStatuses.has(r.status))) {
        hasSeenActiveRun = true;
      }
      // Always show full result in the main output panel for debugging
      setOut(j);
      updateFloatingWindows(j);
      const summary = $("summaryBar");
if (summary && j){
  const avgLat = (typeof j.latency_sec === "number") ? j.latency_sec.toFixed(3) : "-";
  const avgTtft = (typeof j.ttft_sec === "number") ? j.ttft_sec.toFixed(3) : "-";
  const avgTps = (typeof j.token_per_sec === "number") ? j.token_per_sec.toFixed(3) : "-";
  const totalLat = (typeof j.total_latency_sec === "number") ? j.total_latency_sec.toFixed(3) : "-";
  const throughput = (typeof j.throughput_tps === "number") ? j.throughput_tps.toFixed(3) : "-";
  const totalTokens = (typeof j.total_tokens === "number") ? j.total_tokens : "-";
  const startedOffsets = runs
    .map(r => r && typeof r.started_at_offset_sec === "number" ? r.started_at_offset_sec : null)
    .filter(v => v !== null);
  const firstTokenOffsets = runs
    .map(r => r && typeof r.first_token_at_offset_sec === "number" ? r.first_token_at_offset_sec : null)
    .filter(v => v !== null);
  const startedAtOffset = startedOffsets.length ? startedOffsets.map(v => v.toFixed(3)).join(", ") : "-";
  const firstTokenAtOffset = firstTokenOffsets.length ? firstTokenOffsets.map(v => v.toFixed(3)).join(", ") : "-";

  summary.textContent =
    `Avg TTFT: ${avgTtft}s | Avg latency: ${avgLat}s | Avg token/s: ${avgTps} | request start offsets: [${startedAtOffset}] | first token offsets: [${firstTokenAtOffset}] | Throughput: ${throughput} tok/s | Total tokens: ${totalTokens} | Total latency: ${totalLat}s`;
}
      // stop polling once completed/cancelled
      if (j && hasSeenActiveRun && (j.status === "completed" || j.status === "cancelled")){
        stopPolling();
        loadChart();
      }
    }catch(e){
      // keep polling; show error briefly
      setOut("Polling /result failed: " + e);
    }
  }

  async function loadChart(){
    try{
      const res = await fetch("/stat", { method: "GET" });
      const j = await res.json();
      if (j && j.ok && j.image){
        $("statChart").src = "data:image/png;base64," + j.image;
      }
    }catch(e){
      console.error("loadChart failed:", e);
    }
  }

  async function loadModels(){
    const sel = $("model");
    sel.innerHTML = "";

    // placeholder option
    const ph = document.createElement("option");
    ph.value = "";
    ph.textContent = "(加载中…)";
    sel.appendChild(ph);

    try{
      const res = await fetch("/models", { method: "GET" });
      const j = await res.json();
      const list = (j && (j.models || j.data)) || [];

      sel.innerHTML = "";

      if (!Array.isArray(list) || list.length === 0){
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "(没有检测到本地模型)";
        sel.appendChild(opt);
        return;
      }

      // If backend returns raw Ollama format: {data:[{id:...}]}, normalize it
      const ids = list.map(x => (typeof x === "string" ? x : (x.id || ""))).filter(Boolean);
      if (ids.length === 0){
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "(模型列表解析失败)";
        sel.appendChild(opt);
        return;
      }

      for (const id of ids){
        const opt = document.createElement("option");
        opt.value = id;
        opt.textContent = id;
        sel.appendChild(opt);
      }

      // default to first model
      sel.value = ids[0];

    }catch(e){
      sel.innerHTML = "";
      const opt = document.createElement("option");
      opt.value = "";
      opt.textContent = "(加载失败：请检查 /models)";
      sel.appendChild(opt);
    }
  }

  window.addEventListener("load", () => {
    loadModels();
    loadChart();
  });

  function buildPayload(){
    return {
      api_url: $("apiUrl").value.trim(),
      api_key: $("apiKey").value.trim(),
      model: $("model").value || "",
      num_users: parseInt($("numUsers").value || "1", 10),
      prompt: $("prompt").value,
      response_text: "",      // placeholder for model answer (filled by backend /result)
      latency_sec: 0,          // placeholder for latency seconds
      error: "",
      token_per_sec: 0              // placeholder for error message
    };
  }

  function setOut(x){
    return;
  }

  $("clearBtn").onclick = async () => {
  stopPolling();
  hasSeenActiveRun = false;
  expectedRunCount = 0;

  try{
    await fetch("/delete_history", { method: "POST" });
  }catch(e){
    console.error("clear failed:", e);
  }

  const wrap = $("floatWrap");
  if (wrap) wrap.innerHTML = "";

  const summary = $("summaryBar");
  if (summary) summary.textContent = "";

  const chart = $("statChart");
  if (chart) chart.removeAttribute("src");
};

  $("haltBtn").onclick = async () => {
    setOut("Calling POST /halt ...");
    const res = await fetch("/halt", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({reason:"user_stop"})
    });
    setOut(await res.json());
    await pollResult();
    stopPolling();
  };

  $("getResultBtn").onclick = async () => {
    setOut("Calling GET /result ...");
    const res = await fetch("/result", { method: "GET" });
    const j = await res.json();
    setOut(j);
    updateFloatingWindows(j);

    const summary = $("summaryBar");
    if (summary && j){
      const avgLat = (typeof j.latency_sec === "number") ? j.latency_sec.toFixed(3) : "-";
      const avgTtft = (typeof j.ttft_sec === "number") ? j.ttft_sec.toFixed(3) : "-";
      const avgTps = (typeof j.token_per_sec === "number") ? j.token_per_sec.toFixed(3) : "-";
      const totalLat = (typeof j.total_latency_sec === "number") ? j.total_latency_sec.toFixed(3) : "-";
      const throughput = (typeof j.throughput_tps === "number") ? j.throughput_tps.toFixed(3) : "-";
      const totalTokens = (typeof j.total_tokens === "number") ? j.total_tokens : "-";

      summary.textContent =
        `Avg TTFT: ${avgTtft}s | Avg latency: ${avgLat}s | Avg token/s: ${avgTps} | Throughput: ${throughput} tok/s | Total tokens: ${totalTokens} | Total latency: ${totalLat}s`;
    }

    loadChart();
  };

  $("submitBtn").onclick = async () => {
    stopPolling();
    hasSeenActiveRun = false;

    const payload = buildPayload();
    const n = payload.num_users || 1;
    expectedRunCount = n;

    // create one floating window per concurrent user
    createFloatingWindows(n);

    setOut("Running LLM test...\n");

    // Start polling immediately. Do not wait for /submitPrompt to return,
    // otherwise the UI cannot show streaming updates while the backend is still running.
    pollTimer = setInterval(pollResult, 300);

    fetch("/submitPrompt", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    })
    .then(async (res) => {
      const ct = res.headers.get("Content-Type") || "";
      if (ct.includes("application/json")) {
        setOut(await res.json());
      } else {
        setOut(await res.text());
      }
      await pollResult();
    })
    .catch((e) => {
      setOut("POST /submitPrompt failed: " + e);
      stopPolling();
    });
  };
</script>
</body>
</html>
